name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and release marker
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          site = Path('_site')
          site.mkdir()
          for name in ['index.html', '404.html', 'style.css', 'site.js', 'robots.txt', 'sitemap.xml', '.nojekyll']:
              shutil.copy2(name, site / name)
          for name in ['assets', 'work']:
              shutil.copytree(name, site / name)
          assets = {}
          for name in ['style.css', 'site.js']:
              content = (site / name).read_bytes()
              digest = hashlib.sha256(content).hexdigest()[:12]
              target = f'assets/portfolio-{digest}{Path(name).suffix}'
              (site / target).write_bytes(content)
              assets[name] = target
          for page in site.rglob('*.html'):
              content = page.read_text()
              for name, target in assets.items():
                  content = re.sub('/' + re.escape(name) + r'(?:\?[^"\s<>]*)?', '/' + target, content)
              page.write_text(content)
          (site / 'release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'assets': assets}))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
